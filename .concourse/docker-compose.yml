version: '3.8'

services:
  concourse-db:
    image: postgres:13
    environment:
      POSTGRES_DB: concourse
      POSTGRES_PASSWORD: concourse_pass
      POSTGRES_USER: concourse_user
      PGDATA: /database
    volumes:
      - concourse_db:/database

  concourse-web:
    image: concourse/concourse:7.11
    command: web
    links: [concourse-db]
    depends_on: [concourse-db]
    ports: ["8080:8080"]
    volumes: ["./keys/web:/concourse-keys"]
    environment:
      CONCOURSE_EXTERNAL_URL: http://localhost:8080
      CONCOURSE_POSTGRES_HOST: concourse-db
      CONCOURSE_POSTGRES_USER: concourse_user
      CONCOURSE_POSTGRES_PASSWORD: concourse_pass
      CONCOURSE_POSTGRES_DATABASE: concourse
      CONCOURSE_DATADOG_AGENT_HOST: localhost
      CONCOURSE_DATADOG_AGENT_PORT: 8125
      CONCOURSE_DATADOG_PREFIX: concourse.ci
      CONCOURSE_ADD_LOCAL_USER: admin:admin
      CONCOURSE_MAIN_TEAM_LOCAL_USER: admin
      # GitHub OAuth (optional - for team access)
      # CONCOURSE_GITHUB_CLIENT_ID: your_github_client_id
      # CONCOURSE_GITHUB_CLIENT_SECRET: your_github_client_secret

  concourse-worker:
    image: concourse/concourse:7.11
    command: worker
    privileged: true
    depends_on: [concourse-web]
    volumes: ["./keys/worker:/concourse-keys"]
    environment:
      CONCOURSE_TSA_HOST: concourse-web:2222
      CONCOURSE_RUNTIME: containerd
      CONCOURSE_CONTAINERD_DNS_SERVER: "8.8.8.8"
      # Enable Docker daemon for Docker builds
      CONCOURSE_CONTAINERD_DNS_PROXY_ENABLE: "true"

volumes:
  concourse_db: