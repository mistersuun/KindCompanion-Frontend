# SonarCloud Configuration for KindCompanion Frontend

# Project Information
sonar.projectKey=mistersuun_KindCompanion-Frontend
sonar.projectName=KindCompanion Frontend
sonar.projectVersion=1.0.0
sonar.organization=mistersuun

# Source Code
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language Settings
sonar.sourceEncoding=UTF-8

# TypeScript Configuration
sonar.typescript.node=node_modules/typescript/lib/typescript.js
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate Rules
sonar.qualitygate.wait=true
sonar.coverage.minimum=80
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**

# Accessibility and Security Analysis
sonar.javascript.environments=browser,node,jest,cypress

# Disable rules that conflict with Angular/TypeScript patterns
sonar.typescript.ignoreHeaderComments=true

# Custom Quality Profile for Elderly-Focused Accessibility
sonar.profile=kindcompanion-accessibility

# Duplication Detection
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts

# Analysis Parameters
sonar.analysis.mode=publish
sonar.buildString=develop

# Additional Metrics for Healthcare Application
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S*
sonar.issue.ignore.multicriteria.e1.resourceKey=src/**/*.component.ts