# Security Headers for KindCompanion Healthcare Application

# Prevent clickjacking attacks
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable XSS protection
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy for privacy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy for healthcare data protection
add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://www.google-analytics.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: https: blob:;
    media-src 'self' blob:;
    connect-src 'self' https://api.kindcompanion.com wss: ws:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'self';
    upgrade-insecure-requests;
" always;

# Permissions Policy (formerly Feature Policy) for privacy-focused elderly care
add_header Permissions-Policy "
    camera=(),
    microphone=(),
    geolocation=(self),
    payment=(),
    usb=(),
    magnetometer=(),
    accelerometer=(),
    gyroscope=()
" always;

# Strict Transport Security (when using HTTPS)
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;